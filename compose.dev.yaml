name: uptime-urpo-dev

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: uptime_urpo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/dev-db.py up}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run python3 scripts/dev-db.py up}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Run python3 scripts/dev-db.py up}
    ports:
      - "127.0.0.1:${UPTIME_DB_PORT:-54330}:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./database/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime_urpo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  database:
