name: ${UPTIME_PROJECT:?Use deploy/ops.py}

x-app: &app
  image: ${UPTIME_IMAGE:?Build an application image first}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid"]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  stop_grace_period: 30s
  logging: &logs
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: postgres
    environment:
      POSTGRES_DB: uptime_urpo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, migration_password, runtime_password]
    volumes:
      - database:/var/lib/postgresql
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ../database/init-roles.sh:/opt/uptime/create-roles.sh:ro
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
      - /var/run/postgresql:size=8m,mode=3775,uid=999,gid=999
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    shm_size: 128m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d uptime_urpo"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    <<: *app
    environment:
      UPTIME_CONFIG_FILE: /run/secrets/runtime_config
    secrets: [runtime_config]
    networks: [database, outbound]
    ports: ["127.0.0.1:${UPTIME_HTTP_PORT:?Choose an inspected free loopback port}:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  migrate:
    <<: *app
    profiles: [tools]
    command: [--migrate=true]
    environment:
      UPTIME_CONFIG_FILE: /run/secrets/migration_config
    secrets: [migration_config]
    networks: [database]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

networks:
  database: {internal: true}
  outbound: {}

volumes:
  database: {}

secrets:
  admin_password: {file: "${UPTIME_STATE:?}/secrets/admin_password"}
  migration_password: {file: "${UPTIME_STATE:?}/secrets/migration_password"}
  runtime_password: {file: "${UPTIME_STATE:?}/secrets/runtime_password"}
  runtime_config: {file: "${UPTIME_STATE:?}/secrets/runtime.json"}
  migration_config: {file: "${UPTIME_STATE:?}/secrets/migration.json"}
