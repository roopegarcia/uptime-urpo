name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      package_release:
        description: Create an artifact for a manually requested main-branch deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, formatting, fast tests and disposable PostgreSQL tests
        run: python3 scripts/verify.py --part backend
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked install, formatting, tests and production build
        run: python3 scripts/verify.py --part frontend

  operations:
    name: Release and recovery tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate orchestration, documentation and source syntax
        run: python3 scripts/verify.py --part operations

  image:
    name: AMD64 image and recovery
    needs: [backend, frontend, operations]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from locked packages and pinned base digests
        env:
          IMAGE: uptime-urpo:${{ github.sha }}
        run: python3 scripts/verify.py --part image --image "$IMAGE"
      - name: Exercise failed release, rollback and backup recovery on isolated containers
        env:
          IMAGE: uptime-urpo:${{ github.sha }}
        run: python3 deploy/recovery-drill.py --image "$IMAGE"
      - name: Verify runtime schema metadata and package the exact built image
        if: inputs.package_release && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          IMAGE: uptime-urpo:${{ github.sha }}
        run: python3 deploy/package-release.py --image "$IMAGE" --output artifacts/release
      - name: Preserve manually requested deployment candidate
        if: inputs.package_release && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
